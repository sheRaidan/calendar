<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume builder demo</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="layout">
    <section class="panel" aria-labelledby="form-heading">
      <h1 id="form-heading">Build a resume</h1>
      <p>Add a fictional work experience. Entries are public and shared with everyone using this demo.</p>
      <form id="resume-form" novalidate>
        <div class="field">
          <label for="activityName">Activity</label>
          <input id="activityName" name="activityName" type="text" required maxlength="100" aria-describedby="activityName-error">
          <span class="error" id="activityName-error"></span>
        </div>
        <div class="field">
          <label for="activityType">Type</label>
          <input id="activityType" name="activityType" type="text" required maxlength="100" aria-describedby="activityType-error">
          <span class="error" id="activityType-error"></span>
        </div>
        <div class="field">
          <label for="energy">Energy</label>
          <input id="energy" name="energy" type="number" required min="1" max="3" step="1" placeholder="1" aria-describedby="energy-error">
          <span class="error" id="energy-error"></span>
        </div>
        <div class="field">
          <label for="desc">Description</label>
          <textarea id="desc" name="desc" rows="4" required maxlength="1000" aria-describedby="desc-error"></textarea>
          <span class="error" id="desc-error"></span>
        </div>
        <div class="form-actions">
          <button type="submit">Add experience</button>
          <button id="cancel-edit" class="secondary" type="button" hidden>Cancel edit</button>
        </div>
        <p id="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>
    <section class="resume" aria-labelledby="resume-heading">
      <header class="resume-header">
        <h2 id="resume-heading">Your Activities</h2>
        <p>Professional experience</p>
      </header>
      <div id="resume-status" role="status" aria-live="polite">Loading experiences…</div>
      <div id="resume-items"></div>
    </section>
  </main>
  <template id="resume-item-template">
    <article class="experience">
      <div class="experience-heading"><h3 class="activityName"></h3><p class="energy"></p></div>
      <p class="activityType"></p>
      <p class="desc"></p>
      <div class="item-actions">
        <button class="edit-item secondary" type="button">Edit</button>
        <button class="delete-item secondary" type="button">Delete</button>
      </div>
    </article>
  </template>
</body>
</html>
